# Release kindle-mcp. Nothing is published to npm: the package is private, and readers get the Claude Desktop
# bundle (.mcpb) and the plugin from the GitHub release. Two ways to start it:
#   - push a version tag:  git tag v1.0.0 && git push origin v1.0.0
#   - run it from the Actions tab (workflow_dispatch), typing the version in package.json to confirm; the
#     release then creates the v<version> tag at the checked-out commit.
# Either way the version released is the one in package.json on the checked-out commit, a version that already
# has a release is refused (on a manual run, so is one that is already a tag), and the bundle is built and
# self-tested before the tag or the release exists.
# The checkout keeps no credentials and dependencies install without running their scripts; the token is handed
# only to the two steps that talk to GitHub. Inputs reach the shell as environment variables, never as code.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release; must equal the version in package.json (e.g. 1.0.0)"
        required: true
        type: string
permissions:
  contents: write # create the release (and its tag on a manual run)
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Privacy check (nothing from a reader's library in the repository)
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }} # optional: titles and names to refuse, one per line
        run: node scripts/privacy-check.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Read the version from package.json
        id: pkg
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Tag must match package.json (tag push)
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: test "v$VERSION" = "$GITHUB_REF_NAME"
      - name: Typed version must match package.json (manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          TYPED: ${{ inputs.version }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: test "$TYPED" = "$VERSION"
      - name: Refuse a version that already has a release (or, on a manual run, a tag)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already has a release"; exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # --target only places a new tag: an existing one would get this commit's bundle. A failed lookup stops here.
            tags=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$VERSION" --jq '.[].ref')
            if printf '%s\n' "$tags" | grep -qx "refs/tags/v$VERSION"; then
              echo "v$VERSION is already a tag: push that tag to release it, or raise the version"; exit 1
            fi
          fi
      - name: Build and self-test the Claude Desktop bundle (before anything is tagged or released)
        run: node scripts/build-mcpb.mjs
      - name: GitHub release with the bundle attached
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.pkg.outputs.name }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then where="--verify-tag"; else where="--target=$GITHUB_SHA"; fi
          gh release create "v$VERSION" "$NAME-$VERSION.mcpb" "$where" \
            --title "$NAME $VERSION" \
            --notes "Claude Desktop: download the .mcpb below and open it (Settings, Extensions)."
