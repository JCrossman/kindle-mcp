# Publish to npm when a version tag is pushed: `git tag v0.2.0 && git push origin v0.2.0`.
# The tag must match package.json's version. Needs an NPM_TOKEN repository secret (granular
# access token with publish rights). After the first publish, npm's trusted publishing (OIDC)
# can replace the token: configure it on the package's settings page at npmjs.com and drop
# the NODE_AUTH_TOKEN line below.
name: publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write # npm provenance attestation
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Tag must match package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
