# Publish kindle-mcp-server to npm. Two ways to start it:
#   - push a version tag:  git tag v1.0.0 && git push origin v1.0.0
#   - run it from the Actions tab (workflow_dispatch), typing the version in package.json to
#     confirm; the workflow then publishes and creates the v<version> tag itself.
# Either way the version published is the one in package.json on the checked-out commit, a
# version that is already on npm is refused, and the publish carries a provenance attestation.
# The Claude Desktop bundle (.mcpb) is built and self-tested before the npm publish, then attached
# to a GitHub release for the tag.
# Authentication is npm trusted publishing (OIDC): no token or secret anywhere. The package's
# settings on npmjs.com name this repository and this workflow file as its trusted publisher,
# and `id-token: write` below lets the run prove it is that workflow.
name: publish
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish; must equal the version in package.json (e.g. 1.0.0)"
        required: true
        type: string
permissions:
  contents: write # create the tag on a manual run
  id-token: write # npm provenance attestation
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Read the version from package.json
        id: pkg
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Tag must match package.json (tag push)
        if: github.event_name == 'push'
        run: test "v${{ steps.pkg.outputs.version }}" = "$GITHUB_REF_NAME"
      - name: Typed version must match package.json (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: test "${{ inputs.version }}" = "${{ steps.pkg.outputs.version }}"
      - name: Refuse a version that is already on npm
        run: |
          if npm view "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}" version >/dev/null 2>&1; then
            echo "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }} is already published"; exit 1
          fi
      - name: Build and self-test the Claude Desktop bundle (before anything is published)
        run: node scripts/build-mcpb.mjs
      - run: npm install -g npm@latest # trusted publishing needs npm 11.5.1 or newer
      - run: npm publish --provenance --access public
      - name: Create and push the tag (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.pkg.outputs.version }}" -m "${{ steps.pkg.outputs.name }} ${{ steps.pkg.outputs.version }}"
          git push origin "v${{ steps.pkg.outputs.version }}"
      - name: GitHub release with the bundle attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.pkg.outputs.version }}" \
            "${{ steps.pkg.outputs.name }}-${{ steps.pkg.outputs.version }}.mcpb" \
            --title "${{ steps.pkg.outputs.name }} ${{ steps.pkg.outputs.version }}" \
            --notes "npm: https://www.npmjs.com/package/${{ steps.pkg.outputs.name }}/v/${{ steps.pkg.outputs.version }}. Claude Desktop: download the .mcpb below and open it (Settings, Extensions)." \
            --verify-tag
