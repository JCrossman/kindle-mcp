name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Privacy check (nothing from a reader's library in the repository)
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }} # optional: titles and names to refuse, one per line
        run: node scripts/privacy-check.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node dist/cli.js --help
      - name: Build and self-test the Claude Desktop bundle
        if: matrix.node == 22
        run: node scripts/build-mcpb.mjs
