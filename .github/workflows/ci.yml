name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the history check below reads every new commit
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Privacy check (nothing from a reader's library in the repository)
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }} # optional: titles and names to refuse, one per line
        run: node scripts/privacy-check.mjs
      - name: Privacy check of the new commits (their messages and every line they add)
        if: matrix.node == 22
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            node scripts/privacy-check.mjs --range "$BASE..$HEAD_SHA"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            node scripts/privacy-check.mjs --range "$BEFORE..$GITHUB_SHA"
          else
            # a new branch, or a push that rewrote history: everything not already on main
            node scripts/privacy-check.mjs --range "$GITHUB_SHA" --not origin/main
          fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node dist/cli.js --help
      - name: Build and self-test the Claude Desktop bundle
        if: matrix.node == 22
        run: node scripts/build-mcpb.mjs
