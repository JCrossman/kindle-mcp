[project]
name = "kindle-mcp"
version = "0.1.0"
description = "Sync Kindle notes and highlights into a local store and expose them to agents over MCP."
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.0",
  "playwright>=1.45",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kindle-mcp = "kindle_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kindle_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
